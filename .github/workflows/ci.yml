name: YatrAI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Backend Test Suite & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Jest test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: github-actions-ci-test-jwt-secret-key-32chars
          JWT_REFRESH_SECRET: github-actions-ci-test-refresh-secret-key-32chars

  build-frontend:
    name: Verify Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Vite bundle
        run: npm run build

