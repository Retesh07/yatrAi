services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yatrai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./server/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: yatrai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:

